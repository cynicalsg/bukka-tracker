<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名古屋 物価トラッカー | Nagoya Price Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --nagoya: #c2410c; --tokyo: #64748b; --up: #b91c1c; --down: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1f1f22; --text: #ececee; --muted: #9b9ba1; --line: #2e2e33;
            --nagoya: #fb923c; --tokyo: #94a3b8; --up: #f87171; --down: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--nagoya); color: var(--nagoya); font-weight: 600; }
  .legend { display: flex; gap: 16px; margin: 20px 0 8px; color: var(--muted); font-size: .9rem; }
  .swatch { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0; font-size: 1.05rem; }
  .unit { color: var(--muted); font-size: .8rem; }
  .price { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 4px; }
  .price strong { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .chg { font-size: .85rem; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .chart { height: 150px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); }
  .summary { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; margin-top: 20px; }
  @media (max-width: 760px) { .summary { grid-template-columns: minmax(0, 1fr); } }
  .big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .chip span { color: var(--muted); margin-right: 6px; }
  .chart.tall { height: 190px; }
  .chips.cpi { margin-top: -2px; }
  .chips.cpi .chip { border-style: dashed; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
  .key i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--nagoya); vertical-align: middle; margin-right: 6px; }
  .key i.dash { border-top: 2px dashed var(--muted); }
  .note { color: var(--muted); font-size: .78rem; margin: 6px 0 0; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 8px; }
  .card-head h2 { margin: 0; white-space: nowrap; }
  .btn-sm { font-size: .82rem; padding: 4px 10px; white-space: nowrap; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--bg); border: 1px dashed var(--nagoya);
            border-radius: 8px; padding: 8px 10px; margin: 10px 0 4px; font-size: .85rem; }
  .editor { margin-top: 14px; }
  .editor[hidden] { display: none; }
  .editor-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .people { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; margin: 12px 0 4px; }
  .stepper { display: inline-flex; align-items: center; gap: 8px; }
  .stepper button { width: 32px; height: 32px; padding: 0; font-size: 1.1rem; }
  .stepper output { min-width: 1.5em; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 4px 32px; }
  .ed-cat { grid-column: 1 / -1; margin: 14px 0 2px; font-size: .9rem; color: var(--muted); font-weight: 600; }
  .ed-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 44px 58px; gap: 6px; align-items: center;
            padding: 4px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .ed-row label { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .ed-row label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-row input[type=number] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                               border-radius: 6px; padding: 3px 6px; text-align: right; }
  .ed-row input[type=number]:disabled { opacity: .4; }
  .ed-row .u { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-row .c { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  details { margin-top: 10px; font-size: .9rem; }
  summary { cursor: pointer; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .movers h3 { margin: 12px 0 4px; font-size: .9rem; color: var(--muted); font-weight: 500; }
  .movers h3:first-of-type { margin-top: 8px; }
  .movers ol { list-style: none; margin: 0; padding: 0; }
  .movers li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin: 28px 0 0; }
  .section-title { margin: 0; font-size: 1.1rem; }
  .sorts { display: flex; flex-wrap: wrap; gap: 6px; }
  .sorts button { font-size: .85rem; padding: 4px 10px; }
  .cat-title { grid-column: 1 / -1; margin: 14px 0 -4px; font-size: .95rem; color: var(--muted); font-weight: 600; }
  .cat-title:first-child { margin-top: 0; }
  footer { color: var(--muted); font-size: .8rem; padding-top: 24px; padding-bottom: 32px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>
  <div class="controls">
    <button data-range="24"></button><button data-range="60"></button><button data-range="all"></button>
    <button id="lang">English</button>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <section class="card editor" id="basket-editor" hidden></section>
  <div class="section-head">
    <h2 class="section-title" data-i18n="allItems"></h2>
    <div class="sorts"><button data-sort="category"></button><button data-sort="up"></button><button data-sort="down"></button></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
</main>
<footer id="footer"></footer>

<script>
const T = {
  ja: { title: "名古屋 物価トラッカー", subtitle: "名古屋市の生活必需品の小売価格の推移(月次)", per: "あたり",
        r24: "2年", r60: "5年", rall: "全期間", yoy: "前年同月比", noData: "データはまだありません。GitHub Action の初回実行後に表示されます。",
        source: "出典", updated: "更新", toggle: "English",
        sort_category: "分類別", sort_up: "値上がり順", sort_down: "値下がり順", other: "その他",
        allItems: "品目別の価格", mom: "前月比", y1: "1年前比", y5: "5年前比", inBasket: "かごの中身",
        item: "品目", amount: "量", cost: "金額", share: "割合", basketSub: n => `${n}品目・名古屋市の小売価格で計算`,
        movers: "今月の値動き", sinceMonth: "前月から", sinceYear: "前年同月から", up: "値上がり", down: "値下がり",
        noMoves: "変動なし",
        myBasket: "あなたのかご", edit: "かごを編集", close: "閉じる", reset: "初期設定に戻す",
        share: "リンクをコピー", copied: "コピーしました", adults: "大人", children: "子ども",
        childNote: "子どもは大人の0.6人分として計算",
        amountsNote: "量は世帯全体の1か月分です。人数を変えると自動で調整されます。価格は最新月のものです。",
        household: (a, c) => `大人${a}人${c ? `・子ども${c}人` : ""}`,
        shared: "共有されたかごを表示しています。", saveMine: "自分のかごとして保存", backMine: "自分のかごに戻る",
        carried: "* 旬以外の月は直近の旬の価格で計算", empty: "品目が選ばれていません。「かごを編集」から追加してください。",
        cpiRef: "食料CPI", ifCpi: "食料CPIと同じ率で上がった場合", baseline: "食料CPI",
        cpiNote: n => `CPI(消費者物価指数)は名古屋市の「${n}」指数(外食を含む)で、品質調整済み・全国の購入割合で重み付けされています。個々の店頭価格とは一致しないため、目安としてご覧ください。` },
  en: { title: "Nagoya Price Tracker", subtitle: "Monthly retail prices of everyday essentials in Nagoya", per: "per",
        r24: "2 yrs", r60: "5 yrs", rall: "All", yoy: "vs. last year", noData: "No data yet. It will appear after the first GitHub Action run.",
        source: "Source", updated: "Updated", toggle: "日本語",
        sort_category: "By category", sort_up: "Biggest rise", sort_down: "Biggest fall", other: "Other",
        allItems: "Prices by item", mom: "1 mo", y1: "1 yr", y5: "5 yrs", inBasket: "What's in the basket",
        item: "Item", amount: "Amount", cost: "Cost", share: "Share", basketSub: n => `${n} staples at Nagoya retail prices`,
        movers: "Biggest changes", sinceMonth: "Since last month", sinceYear: "Since last year", up: "Up", down: "Down",
        noMoves: "No change",
        myBasket: "Your basket", edit: "Edit basket", close: "Close", reset: "Reset to default",
        share: "Copy link", copied: "Copied", adults: "Adults", children: "Children",
        childNote: "A child counts as 0.6 of an adult",
        amountsNote: "Amounts are monthly totals for your household and scale when you change the number of people. Costs use the latest month's prices.",
        household: (a, c) => `${a} adult${a === 1 ? "" : "s"}${c ? `, ${c} child${c === 1 ? "" : "ren"}` : ""}`,
        shared: "You're viewing a shared basket.", saveMine: "Save as my basket", backMine: "Back to my basket",
        carried: "* Out of season: last in-season price used", empty: "No items selected. Use “Edit basket” to add some.",
        cpiRef: "Food CPI", ifCpi: "If it had risen with food CPI", baseline: "Food CPI",
        cpiNote: n => `CPI (consumer price index) here is Nagoya's food index (${n}), which includes eating out. It is quality-adjusted and weighted by national spending, so it won't match shelf prices exactly; treat it as a reference point.` },
};
let lang = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })()
  || (navigator.language.startsWith("ja") ? "ja" : "en");
let range = "60";
let data = null;
let basket = null;      // defaults from basket.json
let myBasket = null;    // { adults, children, items: { id: amount per adult, in input units } }
let sharedView = false; // basket came from a share link and isn't saved
const basketCharts = [];
const BASKET_KEY = "basket.v1";
let cpi = null;
let sortBy = (() => { try { return localStorage.getItem("sortBy"); } catch { return null; } })() || "category";
const charts = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const yen = v => "¥" + Math.round(v).toLocaleString();
const esc = v => String(v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// "2026-09" shifted back n months -> "2025-09" for n = 12
function monthsBack(m, n) {
  const total = +m.slice(0, 4) * 12 + (+m.slice(5, 7) - 1) - n;
  return `${Math.floor(total / 12)}-${String(total % 12 + 1).padStart(2, "0")}`;
}
function pctSpan(now, before, label = "") {
  if (before == null || !before) return "";
  const pct = (now / before - 1) * 100;
  const cls = pct > 0.05 ? "up" : pct < -0.05 ? "down" : "";
  return `<span class="chg ${cls}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%${label ? " " + label : ""}</span>`;
}
const seriesOf = item => item.series.nagoya || Object.values(item.series)[0] || [];

// ---------- Custom basket
function defaultBasket() {
  return { adults: basket.household.adults, children: basket.household.children,
           items: Object.fromEntries(Object.entries(basket.items).filter(([, v]) => v.default != null).map(([k, v]) => [k, v.default])) };
}
// Accept only known items and sane numbers from storage or a share link.
function cleanBasket(b) {
  if (!b || typeof b !== "object") return null;
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi ? v : null;
  const adults = int(b.adults, 0, 20), children = int(b.children, 0, 20);
  if (adults == null || children == null || !b.items || typeof b.items !== "object") return null;
  const items = {};
  for (const [k, v] of Object.entries(b.items)) {
    if (basket.items[k] && typeof v === "number" && Number.isFinite(v) && v > 0 && v < 1e6) items[k] = v;
  }
  return { adults, children, items };
}
const b64url = str => btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64url = str => atob(str.replace(/-/g, "+").replace(/_/g, "/"));
function loadBasket() {
  const h = location.hash.match(/[#&]b=([A-Za-z0-9_-]+)/);
  if (h) {
    try { const b = cleanBasket(JSON.parse(unb64url(h[1]))); if (b) { sharedView = true; return b; } } catch {}
  }
  try { const b = cleanBasket(JSON.parse(localStorage.getItem(BASKET_KEY))); if (b) return b; } catch {}
  return defaultBasket();
}
function saveBasket() {
  if (sharedView) return;
  try { localStorage.setItem(BASKET_KEY, JSON.stringify(myBasket)); } catch {}
}
const multiplier = () => myBasket.adults + basket.child_factor * myBasket.children;
const sameAsDefault = () => JSON.stringify(cleanBasket(myBasket)) === JSON.stringify(cleanBasket(defaultBasket()));
const fmtQty = v => v >= 100 ? String(Math.round(v)) : String(Math.round(v * 100) / 100);
const latestPrice = item => { const s = seriesOf(item); return s.length ? s[s.length - 1][1] : null; };

// Monthly cost of the custom basket. Seasonal items reuse their last in-season price for up to 11 months;
// months before an item's series starts are left out.
function basketSeries() {
  const mult = multiplier();
  const parts = data.items.filter(i => basket.items[i.id] && myBasket.items[i.id] > 0).map(i => ({
    item: i, amount: myBasket.items[i.id] * mult, units: myBasket.items[i.id] * mult * basket.items[i.id].per,
    own: new Map(seriesOf(i)), prices: new Map(), carried: new Set(),
  }));
  if (!parts.length || mult <= 0) return { parts, points: [] };
  const months = [...new Set(parts.flatMap(p => [...p.own.keys()]))].sort();
  for (const p of parts) {
    let last = null, lastK = -99;
    months.forEach((m, k) => {
      if (p.own.has(m)) { last = p.own.get(m); lastK = k; p.prices.set(m, last); }
      else if (last != null && k - lastK <= 11) { p.prices.set(m, last); p.carried.add(m); }
    });
  }
  const points = [];
  for (const m of months) {
    if (parts.every(p => p.prices.has(m))) points.push([m, parts.reduce((sum, p) => sum + p.units * p.prices.get(m), 0)]);
  }
  return { parts, points };
}

const cpiFood = () => cpi?.series?.food?.points?.length ? new Map(cpi.series.food.points) : null;

// Where a price would be if it had moved with food CPI since the first shown month that has both values.
function cpiPath(labels, values) {
  const idx = cpiFood();
  if (!idx) return null;
  const k = labels.findIndex((m, i) => values[i] != null && idx.has(m));
  if (k < 0) return null;
  const base = values[k] / idx.get(labels[k]);
  return labels.map((m, i) => i < k || !idx.has(m) ? null : base * idx.get(m));
}
const refDataset = (labels, values, label) => {
  const path = cpiPath(labels, values);
  return path ? [{ label, data: path, borderColor: css("--muted"), borderWidth: 1.25, borderDash: [4, 4],
                   pointRadius: 0, spanGaps: true, tension: 0.2 }] : [];
};

function lineChart(canvas, labels, values, label, refLabel) {
  return new Chart(canvas, {
    type: "line",
    data: { labels, datasets: [{ label, data: values, borderColor: css("--nagoya"), borderWidth: 2,
                                 pointRadius: 0, spanGaps: true, tension: 0.2 },
                               ...(refLabel ? refDataset(labels, values, refLabel) : [])] },
    options: {
      maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
      scales: {
        x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
        y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
      },
    },
  });
}

// Food CPI change over the same windows as the basket chips, ending in the same month.
function cpiChips(m, t) {
  const idx = cpiFood();
  if (!idx || !idx.has(m)) return "";
  const c = (label, n) => idx.has(monthsBack(m, n))
    ? `<div class="chip"><span>${label}</span>${pctSpan(idx.get(m), idx.get(monthsBack(m, n)))}</div>` : "";
  return `<div class="chips cpi"><div class="chip" style="border:none;padding-left:0"><span>${t.cpiRef}</span></div>${c(t.mom, 1)}${c(t.y1, 12)}${c(t.y5, 60)}</div>`;
}

function renderBasket(t) {
  const slot = document.getElementById("basket-slot");
  if (!slot) return;
  basketCharts.splice(0).forEach(c => c.destroy());
  const { parts, points } = basketSeries();
  const title = sameAsDefault() && !sharedView ? basket["name_" + lang] : t.myBasket;
  const card = document.createElement("section");
  card.className = "card";
  const head = `<div class="card-head"><h2>${esc(title)}</h2>
      <button class="btn-sm" id="edit-basket" aria-expanded="${!document.getElementById("basket-editor").hidden}">${t.edit}</button></div>
    <div class="unit">${t.household(myBasket.adults, myBasket.children)} · ${t.basketSub(parts.length)}</div>
    ${sharedView ? `<div class="banner"><span>${t.shared}</span><button class="btn-sm" id="save-shared">${t.saveMine}</button>
      <button class="btn-sm" id="drop-shared">${t.backMine}</button></div>` : ""}`;
  if (!points.length) {
    card.innerHTML = head + `<p class="unit" style="margin-top:12px">${t.empty}</p>`;
  } else {
    const map = new Map(points);
    const [m, now] = points[points.length - 1];
    const chip = (label, n) => {
      const before = map.get(monthsBack(m, n));
      return before == null ? "" :
        `<div class="chip"><span>${label}</span>${pctSpan(now, before)} <span>(${now >= before ? "+" : "−"}${yen(Math.abs(now - before))})</span></div>`;
    };
    const rows = parts.map(p => ({ p, cost: p.units * p.prices.get(m) })).sort((a, b) => b.cost - a.cost);
    const anyCarried = rows.some(({ p }) => p.carried.has(m));
    card.innerHTML = head + `
      <div class="price"><span class="big">${yen(now)}</span><span class="unit">${m}</span></div>
      <div class="chips">${chip(t.mom, 1)}${chip(t.y1, 12)}${chip(t.y5, 60)}</div>
      ${cpiChips(m, t)}
      <div class="chart tall"><canvas></canvas></div>
      ${cpiFood() ? `<div class="key"><span><i></i>${esc(title)}</span><span><i class="dash"></i>${t.ifCpi}</span></div>
      <p class="note">${t.cpiNote(esc(cpi.series.food.estat_name))}</p>` : ""}
      <details><summary>${t.inBasket}</summary>
        <table><thead><tr><th>${t.item}</th><th>${t.amount}</th><th>${t.cost}</th><th>${t.share}</th></tr></thead>
        <tbody>${rows.map(({ p, cost }) => `<tr><td>${esc(p.item["name_" + lang])}${p.carried.has(m) ? " *" : ""}</td>
          <td>${fmtQty(p.amount)} ${esc(basket.items[p.item.id]["input_" + lang])}</td><td>${yen(cost)}</td>
          <td>${(cost / now * 100).toFixed(0)}%</td></tr>`).join("")}</tbody></table>
        ${anyCarried ? `<p class="note">${t.carried}</p>` : ""}
      </details>`;
    const shown = range === "all" ? points : points.slice(-Number(range));
    slot.replaceChildren(card);
    basketCharts.push(lineChart(card.querySelector("canvas"), shown.map(p => p[0]), shown.map(p => p[1]), title, t.ifCpi));
  }
  if (!points.length) slot.replaceChildren(card);
  card.querySelector("#edit-basket").onclick = () => toggleEditor();
  if (sharedView) {
    card.querySelector("#save-shared").onclick = () => { sharedView = false; clearHash(); saveBasket(); renderBasket(T[lang]); renderEditor(); };
    card.querySelector("#drop-shared").onclick = () => { sharedView = false; clearHash(); myBasket = loadBasket(); renderBasket(T[lang]); renderEditor(); };
  }
}
const clearHash = () => history.replaceState(null, "", location.pathname + location.search);

// ---------- Basket editor
function toggleEditor(open) {
  const ed = document.getElementById("basket-editor");
  ed.hidden = open === undefined ? !ed.hidden : !open;
  document.getElementById("edit-basket")?.setAttribute("aria-expanded", String(!ed.hidden));
  if (!ed.hidden) { renderEditor(); ed.scrollIntoView({ behavior: "smooth", block: "start" }); }
}
let basketTimer;
function basketChanged(rerenderEditor) {
  saveBasket();
  if (rerenderEditor) renderEditor();
  clearTimeout(basketTimer);
  basketTimer = setTimeout(() => renderBasket(T[lang]), 120);
}
function renderEditor() {
  const ed = document.getElementById("basket-editor");
  if (ed.hidden || !data || !basket) return;
  const t = T[lang];
  const mult = multiplier();
  const cats = data.categories || [];
  const byCat = id => data.items.filter(i => basket.items[i.id] && (i.category || "") === id);
  const groups = [...cats.map(c => [c, byCat(c.id)]), [{ ["name_" + lang]: t.other }, data.items.filter(i => basket.items[i.id] && !cats.some(c => c.id === i.category))]]
    .filter(([, list]) => list.length);
  const costOf = (i, amount) => { const pr = latestPrice(i); return pr == null ? "–" : yen(amount * basket.items[i.id].per * pr); };
  ed.innerHTML = `<div class="card-head"><h2>${t.edit}</h2>
      <div class="editor-actions"><button class="btn-sm" id="ed-reset">${t.reset}</button>
      <button class="btn-sm" id="ed-share">${t.share}</button><button class="btn-sm" id="ed-close">${t.close}</button></div></div>
    <div class="people">
      ${["adults", "children"].map(k => `<span class="stepper"><span>${t[k]}</span>
        <button data-step="${k}" data-d="-1" aria-label="${t[k]} −">−</button><output>${myBasket[k]}</output>
        <button data-step="${k}" data-d="1" aria-label="${t[k]} +">+</button></span>`).join("")}
      <span class="note" style="margin:0">${t.childNote}</span>
    </div>
    <p class="note">${t.amountsNote}</p>
    <div class="ed-grid">${groups.map(([c, list]) => `<h3 class="ed-cat">${esc(c["name_" + lang])}</h3>` + list.map(i => {
      const spec = basket.items[i.id], on = myBasket.items[i.id] > 0;
      const amount = (on ? myBasket.items[i.id] : spec.suggest) * (mult || 1);
      return `<div class="ed-row" data-id="${i.id}">
        <label><input type="checkbox" ${on ? "checked" : ""}><span>${esc(i["name_" + lang])}</span></label>
        <input type="number" min="0" step="${spec.step}" value="${fmtQty(amount)}" ${on ? "" : "disabled"} aria-label="${esc(i["name_" + lang])}">
        <span class="u">${esc(spec["input_" + lang])}</span>
        <span class="c">${on ? costOf(i, amount) : ""}</span></div>`;
    }).join("")).join("")}</div>`;

  ed.querySelector("#ed-close").onclick = () => toggleEditor(false);
  ed.querySelector("#ed-reset").onclick = () => { myBasket = defaultBasket(); basketChanged(true); };
  ed.querySelector("#ed-share").onclick = async e => {
    const btn = e.currentTarget;  // currentTarget is cleared once the handler awaits
    const url = `${location.origin}${location.pathname}#b=${b64url(JSON.stringify(myBasket))}`;
    try { await navigator.clipboard.writeText(url); } catch { window.prompt(t.share, url); return; }
    btn.textContent = t.copied; setTimeout(() => { btn.textContent = t.share; }, 1500);
  };
  ed.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    const k = b.dataset.step, min = k === "adults" ? 1 : 0;
    myBasket[k] = Math.max(min, Math.min(20, myBasket[k] + Number(b.dataset.d)));
    basketChanged(true);
  });
  ed.querySelectorAll(".ed-row").forEach(row => {
    const id = row.dataset.id, item = data.items.find(i => i.id === id), spec = basket.items[id];
    const box = row.querySelector("input[type=checkbox]"), num = row.querySelector("input[type=number]"), cost = row.querySelector(".c");
    box.onchange = () => {
      if (box.checked) myBasket.items[id] = (Number(num.value) || spec.suggest * (multiplier() || 1)) / (multiplier() || 1);
      else delete myBasket.items[id];
      num.disabled = !box.checked;
      cost.textContent = box.checked ? costOf(item, myBasket.items[id] * multiplier()) : "";
      basketChanged(false);
    };
    num.oninput = () => {
      const v = Number(num.value);
      if (!Number.isFinite(v) || v < 0) return;
      if (v === 0) delete myBasket.items[id]; else myBasket.items[id] = v / (multiplier() || 1);
      cost.textContent = v > 0 ? costOf(item, v) : "";
      basketChanged(false);
    };
  });
}

function renderSummary(t) {
  const box = document.getElementById("summary");
  box.innerHTML = "";
  if (!data || !data.items.length) return;

  // ---- Basket card (rendered separately so editing doesn't redraw every chart)
  if (basket && myBasket) {
    const slot = document.createElement("div");
    slot.id = "basket-slot";
    box.appendChild(slot);
    renderBasket(t);
  }

  // ---- Biggest changes card
  const latest = data.items.map(seriesOf).filter(s => s.length).map(s => s[s.length - 1][0]).sort().pop();
  const changes = n => data.items.map(i => {
    const m = new Map(seriesOf(i));
    const now = m.get(latest), before = m.get(monthsBack(latest, n));
    return now != null && before ? { i, now, before, pct: (now / before - 1) * 100 } : null;
  }).filter(Boolean);
  const list = (rows, label) => rows.length ? `<h3>${label}</h3><ol>${rows.map(r =>
      `<li><span>${esc(r.i["name_" + lang])}</span>${pctSpan(r.now, r.before)}</li>`).join("")}</ol>` : "";
  const block = (title, n) => {
    const c = changes(n).sort((a, b) => b.pct - a.pct);
    const ups = c.filter(r => r.pct > 0.05).slice(0, 3);
    const downs = c.filter(r => r.pct < -0.05).reverse().slice(0, 3);
    const idx = cpiFood();
    const base = idx && idx.has(latest) && idx.has(monthsBack(latest, n))
      ? ` <span class="unit" style="font-weight:400">(${t.baseline} ${pctSpan(idx.get(latest), idx.get(monthsBack(latest, n)))})</span>` : "";
    return `<h3 style="color:var(--text);font-weight:600">${title}${base}</h3>` +
      (ups.length || downs.length ? list(ups, t.up) + list(downs, t.down) : `<p class="unit">${t.noMoves}</p>`);
  };
  const movers = document.createElement("section");
  movers.className = "card movers";
  movers.innerHTML = `<h2>${t.movers}</h2><div class="unit">${latest}</div>
    ${block(t.sinceMonth, 1)}${block(t.sinceYear, 12)}`;
  box.appendChild(movers);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-range]").forEach(b => {
    b.textContent = t["r" + b.dataset.range];
    b.setAttribute("aria-pressed", b.dataset.range === range);
  });
  document.getElementById("lang").textContent = t.toggle;
  charts.splice(0).forEach(c => c.destroy());
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  renderSummary(t);
  renderEditor();

  if (!data || !data.items.length) {
    document.getElementById("legend").innerHTML = "";
    grid.innerHTML = `<div class="empty">${t.noData}</div>`;
    document.getElementById("footer").textContent = "";
    return;
  }

  const color = id => css(id === "nagoya" ? "--nagoya" : "--tokyo");
  document.getElementById("legend").innerHTML = data.areas.length < 2 ? "" : data.areas.map(a =>
    `<span><span class="swatch" style="background:${color(a.id)}"></span>${a["name_" + lang]}</span>`).join("");

  document.querySelectorAll("[data-sort]").forEach(b => {
    b.textContent = t["sort_" + b.dataset.sort];
    b.setAttribute("aria-pressed", b.dataset.sort === sortBy);
  });

  // Latest price and year-on-year change for each item, then order them.
  const rows = data.items.map(item => {
    const main = seriesOf(item);
    if (!main.length) return null;
    const [lastMonth, last] = main[main.length - 1];
    const before = new Map(main).get(monthsBack(lastMonth, 12));
    return { item, main, lastMonth, last, before, pct: before ? last / before - 1 : null };
  }).filter(Boolean);
  const cats = data.categories || [];
  const catIndex = id => { const i = cats.findIndex(c => c.id === id); return i < 0 ? cats.length : i; };
  if (sortBy === "category") rows.sort((a, b) => catIndex(a.item.category) - catIndex(b.item.category));
  else {
    const dir = sortBy === "up" ? -1 : 1;
    rows.sort((a, b) => (a.pct == null) - (b.pct == null) || dir * (a.pct - b.pct));
  }

  let currentCat;
  for (const { item, main, lastMonth, last, before } of rows) {
    if (sortBy === "category" && item.category !== currentCat) {
      currentCat = item.category;
      const c = cats.find(c => c.id === currentCat);
      const h = document.createElement("h3");
      h.className = "cat-title";
      h.textContent = c ? c["name_" + lang] : t.other;
      grid.appendChild(h);
    }
    const chg = pctSpan(last, before, t.yoy);
    const unit = item["unit_" + lang] ? (lang === "ja" ? `${item.unit_ja}${t.per}` : `${t.per} ${item.unit_en}`) : "";
    const sub = [unit, item["note_" + lang]].filter(Boolean).join(" · ");

    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2>${item["name_" + lang]}</h2>
      <div class="unit">${sub || "&nbsp;"}</div>
      <div class="price"><strong>${yen(last)}</strong>${chg}</div>
      <div class="unit">${lastMonth}</div>
      <div class="chart"><canvas></canvas></div>`;
    grid.appendChild(card);

    const months = [...new Set(Object.values(item.series).flat().map(p => p[0]))].sort();
    const shown = range === "all" ? months : months.slice(-Number(range));
    charts.push(new Chart(card.querySelector("canvas"), {
      type: "line",
      data: {
        labels: shown,
        datasets: [...data.areas.filter(a => item.series[a.id]).map(a => {
          const m = new Map(item.series[a.id]);
          return { label: a["name_" + lang], data: shown.map(x => m.get(x) ?? null),
                   borderColor: color(a.id), borderWidth: a.id === "nagoya" ? 2 : 1.25,
                   pointRadius: 0, spanGaps: true, tension: 0.2 };
        }), ...refDataset(shown, shown.map(x => new Map(main).get(x) ?? null), t.ifCpi)],
      },
      options: {
        maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
        scales: {
          x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
          y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
        },
      },
    }));
  }
  const s = data.source;
  document.getElementById("footer").innerHTML =
    `${t.source}: ${s["name_" + lang]}${cpi ? "; " + cpi.source["name_" + lang] : ""} (<a href="https://www.e-stat.go.jp/">e-Stat</a>) · ${t.updated}: ${data.updated.slice(0, 10)}`;
}

document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { range = b.dataset.range; render(); });
document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
  sortBy = b.dataset.sort;
  try { localStorage.setItem("sortBy", sortBy); } catch {}
  render();
});
document.getElementById("lang").onclick = () => {
  lang = lang === "ja" ? "en" : "ja";
  try { localStorage.setItem("lang", lang); } catch {}
  render();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

const load = url => fetch(url, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
Promise.all([load("data/prices.json"), load("basket.json"), load("data/cpi.json")])
  .then(([d, b, c]) => {
    data = d; basket = b; cpi = c;
    if (basket) myBasket = loadBasket();
    render();
  });
</script>
</body>
</html>
