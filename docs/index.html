<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名古屋 物価トラッカー | Nagoya Price Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --nagoya: #c2410c; --tokyo: #64748b; --up: #b91c1c; --down: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1f1f22; --text: #ececee; --muted: #9b9ba1; --line: #2e2e33;
            --nagoya: #fb923c; --tokyo: #94a3b8; --up: #f87171; --down: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--nagoya); color: var(--nagoya); font-weight: 600; }
  .legend { display: flex; gap: 16px; margin: 20px 0 8px; color: var(--muted); font-size: .9rem; }
  .swatch { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0; font-size: 1.05rem; }
  .unit { color: var(--muted); font-size: .8rem; }
  .price { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 4px; }
  .price strong { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .chg { font-size: .85rem; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .chart { height: 150px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); }
  .summary { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; margin-top: 20px; }
  @media (max-width: 760px) { .summary { grid-template-columns: minmax(0, 1fr); } }
  .big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .chip span { color: var(--muted); margin-right: 6px; }
  .chart.tall { height: 190px; }
  details { margin-top: 10px; font-size: .9rem; }
  summary { cursor: pointer; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .movers h3 { margin: 12px 0 4px; font-size: .9rem; color: var(--muted); font-weight: 500; }
  .movers h3:first-of-type { margin-top: 8px; }
  .movers ol { list-style: none; margin: 0; padding: 0; }
  .movers li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin: 28px 0 0; }
  .section-title { margin: 0; font-size: 1.1rem; }
  .sorts { display: flex; flex-wrap: wrap; gap: 6px; }
  .sorts button { font-size: .85rem; padding: 4px 10px; }
  .cat-title { grid-column: 1 / -1; margin: 14px 0 -4px; font-size: .95rem; color: var(--muted); font-weight: 600; }
  .cat-title:first-child { margin-top: 0; }
  footer { color: var(--muted); font-size: .8rem; padding-top: 24px; padding-bottom: 32px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>
  <div class="controls">
    <button data-range="24"></button><button data-range="60"></button><button data-range="all"></button>
    <button id="lang">English</button>
  </div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="section-head">
    <h2 class="section-title" data-i18n="allItems"></h2>
    <div class="sorts"><button data-sort="category"></button><button data-sort="up"></button><button data-sort="down"></button></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
</main>
<footer id="footer"></footer>

<script>
const T = {
  ja: { title: "名古屋 物価トラッカー", subtitle: "名古屋市の生活必需品の小売価格の推移(月次)", per: "あたり",
        r24: "2年", r60: "5年", rall: "全期間", yoy: "前年同月比", noData: "データはまだありません。GitHub Action の初回実行後に表示されます。",
        source: "出典", updated: "更新", toggle: "English",
        sort_category: "分類別", sort_up: "値上がり順", sort_down: "値下がり順", other: "その他",
        allItems: "品目別の価格", mom: "前月比", y1: "1年前比", y5: "5年前比", inBasket: "かごの中身",
        item: "品目", amount: "量", cost: "金額", share: "割合", basketSub: n => `${n}品目・名古屋市の小売価格で計算`,
        movers: "今月の値動き", sinceMonth: "前月から", sinceYear: "前年同月から", up: "値上がり", down: "値下がり",
        noMoves: "変動なし" },
  en: { title: "Nagoya Price Tracker", subtitle: "Monthly retail prices of everyday essentials in Nagoya", per: "per",
        r24: "2 yrs", r60: "5 yrs", rall: "All", yoy: "vs. last year", noData: "No data yet. It will appear after the first GitHub Action run.",
        source: "Source", updated: "Updated", toggle: "日本語",
        sort_category: "By category", sort_up: "Biggest rise", sort_down: "Biggest fall", other: "Other",
        allItems: "Prices by item", mom: "1 mo", y1: "1 yr", y5: "5 yrs", inBasket: "What's in the basket",
        item: "Item", amount: "Amount", cost: "Cost", share: "Share", basketSub: n => `${n} staples at Nagoya retail prices`,
        movers: "Biggest changes", sinceMonth: "Since last month", sinceYear: "Since last year", up: "Up", down: "Down",
        noMoves: "No change" },
};
let lang = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })()
  || (navigator.language.startsWith("ja") ? "ja" : "en");
let range = "60";
let data = null;
let basket = null;
let sortBy = (() => { try { return localStorage.getItem("sortBy"); } catch { return null; } })() || "category";
const charts = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const yen = v => "¥" + Math.round(v).toLocaleString();
const esc = v => String(v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// "2026-09" shifted back n months -> "2025-09" for n = 12
function monthsBack(m, n) {
  const total = +m.slice(0, 4) * 12 + (+m.slice(5, 7) - 1) - n;
  return `${Math.floor(total / 12)}-${String(total % 12 + 1).padStart(2, "0")}`;
}
function pctSpan(now, before, label = "") {
  if (before == null || !before) return "";
  const pct = (now / before - 1) * 100;
  const cls = pct > 0.05 ? "up" : pct < -0.05 ? "down" : "";
  return `<span class="chg ${cls}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%${label ? " " + label : ""}</span>`;
}
const seriesOf = item => item.series.nagoya || Object.values(item.series)[0] || [];

// Monthly cost of the basket, only for months where every basket item has a price.
function basketSeries() {
  const parts = data.items.filter(i => basket.items[i.id])
    .map(i => ({ item: i, qty: basket.items[i.id].qty, prices: new Map(seriesOf(i)) }));
  if (!parts.length) return { parts, points: [] };
  const months = [...new Set(parts.flatMap(p => [...p.prices.keys()]))].sort();
  const points = [];
  for (const m of months) {
    if (parts.every(p => p.prices.has(m))) points.push([m, parts.reduce((sum, p) => sum + p.qty * p.prices.get(m), 0)]);
  }
  return { parts, points };
}

function lineChart(canvas, labels, values, label) {
  return new Chart(canvas, {
    type: "line",
    data: { labels, datasets: [{ label, data: values, borderColor: css("--nagoya"), borderWidth: 2,
                                 pointRadius: 0, spanGaps: true, tension: 0.2 }] },
    options: {
      maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
      scales: {
        x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
        y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
      },
    },
  });
}

function renderSummary(t) {
  const box = document.getElementById("summary");
  box.innerHTML = "";
  if (!data || !data.items.length) return;

  // ---- Basket card
  if (basket) {
    const { parts, points } = basketSeries();
    if (points.length) {
      const map = new Map(points);
      const [m, now] = points[points.length - 1];
      const chip = (label, n) => {
        const before = map.get(monthsBack(m, n));
        return before == null ? "" :
          `<div class="chip"><span>${label}</span>${pctSpan(now, before)} <span>(${now >= before ? "+" : "−"}${yen(Math.abs(now - before))})</span></div>`;
      };
      const rows = parts.map(p => ({ p, cost: p.qty * p.prices.get(m) })).sort((a, b) => b.cost - a.cost);
      const card = document.createElement("section");
      card.className = "card";
      card.innerHTML = `<h2>${esc(basket["name_" + lang])}</h2>
        <div class="unit">${t.basketSub(parts.length)}</div>
        <div class="price"><span class="big">${yen(now)}</span><span class="unit">${m}</span></div>
        <div class="chips">${chip(t.mom, 1)}${chip(t.y1, 12)}${chip(t.y5, 60)}</div>
        <div class="chart tall"><canvas></canvas></div>
        <details><summary>${t.inBasket}</summary>
          <table><thead><tr><th>${t.item}</th><th>${t.amount}</th><th>${t.cost}</th><th>${t.share}</th></tr></thead>
          <tbody>${rows.map(({ p, cost }) => `<tr><td>${esc(p.item["name_" + lang])}</td>
            <td>${esc(basket.items[p.item.id][lang] ?? p.qty)}</td><td>${yen(cost)}</td>
            <td>${(cost / now * 100).toFixed(0)}%</td></tr>`).join("")}</tbody></table>
        </details>`;
      box.appendChild(card);
      const shown = range === "all" ? points : points.slice(-Number(range));
      charts.push(lineChart(card.querySelector("canvas"), shown.map(p => p[0]), shown.map(p => p[1]),
                            basket["name_" + lang]));
    }
  }

  // ---- Biggest changes card
  const latest = data.items.map(seriesOf).filter(s => s.length).map(s => s[s.length - 1][0]).sort().pop();
  const changes = n => data.items.map(i => {
    const m = new Map(seriesOf(i));
    const now = m.get(latest), before = m.get(monthsBack(latest, n));
    return now != null && before ? { i, now, before, pct: (now / before - 1) * 100 } : null;
  }).filter(Boolean);
  const list = (rows, label) => rows.length ? `<h3>${label}</h3><ol>${rows.map(r =>
      `<li><span>${esc(r.i["name_" + lang])}</span>${pctSpan(r.now, r.before)}</li>`).join("")}</ol>` : "";
  const block = (title, n) => {
    const c = changes(n).sort((a, b) => b.pct - a.pct);
    const ups = c.filter(r => r.pct > 0.05).slice(0, 3);
    const downs = c.filter(r => r.pct < -0.05).reverse().slice(0, 3);
    return `<h3 style="color:var(--text);font-weight:600">${title}</h3>` +
      (ups.length || downs.length ? list(ups, t.up) + list(downs, t.down) : `<p class="unit">${t.noMoves}</p>`);
  };
  const movers = document.createElement("section");
  movers.className = "card movers";
  movers.innerHTML = `<h2>${t.movers}</h2><div class="unit">${latest}</div>
    ${block(t.sinceMonth, 1)}${block(t.sinceYear, 12)}`;
  box.appendChild(movers);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-range]").forEach(b => {
    b.textContent = t["r" + b.dataset.range];
    b.setAttribute("aria-pressed", b.dataset.range === range);
  });
  document.getElementById("lang").textContent = t.toggle;
  charts.splice(0).forEach(c => c.destroy());
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  renderSummary(t);

  if (!data || !data.items.length) {
    document.getElementById("legend").innerHTML = "";
    grid.innerHTML = `<div class="empty">${t.noData}</div>`;
    document.getElementById("footer").textContent = "";
    return;
  }

  const color = id => css(id === "nagoya" ? "--nagoya" : "--tokyo");
  document.getElementById("legend").innerHTML = data.areas.length < 2 ? "" : data.areas.map(a =>
    `<span><span class="swatch" style="background:${color(a.id)}"></span>${a["name_" + lang]}</span>`).join("");

  document.querySelectorAll("[data-sort]").forEach(b => {
    b.textContent = t["sort_" + b.dataset.sort];
    b.setAttribute("aria-pressed", b.dataset.sort === sortBy);
  });

  // Latest price and year-on-year change for each item, then order them.
  const rows = data.items.map(item => {
    const main = seriesOf(item);
    if (!main.length) return null;
    const [lastMonth, last] = main[main.length - 1];
    const before = new Map(main).get(monthsBack(lastMonth, 12));
    return { item, main, lastMonth, last, before, pct: before ? last / before - 1 : null };
  }).filter(Boolean);
  const cats = data.categories || [];
  const catIndex = id => { const i = cats.findIndex(c => c.id === id); return i < 0 ? cats.length : i; };
  if (sortBy === "category") rows.sort((a, b) => catIndex(a.item.category) - catIndex(b.item.category));
  else {
    const dir = sortBy === "up" ? -1 : 1;
    rows.sort((a, b) => (a.pct == null) - (b.pct == null) || dir * (a.pct - b.pct));
  }

  let currentCat;
  for (const { item, main, lastMonth, last, before } of rows) {
    if (sortBy === "category" && item.category !== currentCat) {
      currentCat = item.category;
      const c = cats.find(c => c.id === currentCat);
      const h = document.createElement("h3");
      h.className = "cat-title";
      h.textContent = c ? c["name_" + lang] : t.other;
      grid.appendChild(h);
    }
    const chg = pctSpan(last, before, t.yoy);
    const unit = item["unit_" + lang] ? (lang === "ja" ? `${item.unit_ja}${t.per}` : `${t.per} ${item.unit_en}`) : "";
    const sub = [unit, item["note_" + lang]].filter(Boolean).join(" · ");

    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2>${item["name_" + lang]}</h2>
      <div class="unit">${sub || "&nbsp;"}</div>
      <div class="price"><strong>${yen(last)}</strong>${chg}</div>
      <div class="unit">${lastMonth}</div>
      <div class="chart"><canvas></canvas></div>`;
    grid.appendChild(card);

    const months = [...new Set(Object.values(item.series).flat().map(p => p[0]))].sort();
    const shown = range === "all" ? months : months.slice(-Number(range));
    charts.push(new Chart(card.querySelector("canvas"), {
      type: "line",
      data: {
        labels: shown,
        datasets: data.areas.filter(a => item.series[a.id]).map(a => {
          const m = new Map(item.series[a.id]);
          return { label: a["name_" + lang], data: shown.map(x => m.get(x) ?? null),
                   borderColor: color(a.id), borderWidth: a.id === "nagoya" ? 2 : 1.25,
                   pointRadius: 0, spanGaps: true, tension: 0.2 };
        }),
      },
      options: {
        maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
        scales: {
          x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
          y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
        },
      },
    }));
  }
  const s = data.source;
  document.getElementById("footer").innerHTML =
    `${t.source}: ${s["name_" + lang]} (<a href="https://www.e-stat.go.jp/">e-Stat</a>) · ${t.updated}: ${data.updated.slice(0, 10)}`;
}

document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { range = b.dataset.range; render(); });
document.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
  sortBy = b.dataset.sort;
  try { localStorage.setItem("sortBy", sortBy); } catch {}
  render();
});
document.getElementById("lang").onclick = () => {
  lang = lang === "ja" ? "en" : "ja";
  try { localStorage.setItem("lang", lang); } catch {}
  render();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

const load = url => fetch(url, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
Promise.all([load("data/prices.json"), load("basket.json")])
  .then(([d, b]) => { data = d; basket = b; render(); });
</script>
</body>
</html>
