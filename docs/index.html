<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名古屋 物価トラッカー | Nagoya Price Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --nagoya: #c2410c; --tokyo: #64748b; --up: #b91c1c; --down: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #1f1f22; --text: #ececee; --muted: #9b9ba1; --line: #2e2e33;
            --nagoya: #fb923c; --tokyo: #94a3b8; --up: #f87171; --down: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--nagoya); color: var(--nagoya); font-weight: 600; }
  .legend { display: flex; gap: 16px; margin: 20px 0 8px; color: var(--muted); font-size: .9rem; }
  .swatch { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0; font-size: 1.05rem; }
  .unit { color: var(--muted); font-size: .8rem; }
  .price { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 4px; }
  .price strong { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .chg { font-size: .85rem; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .chart { height: 150px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); }
  footer { color: var(--muted); font-size: .8rem; padding-top: 24px; padding-bottom: 32px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
  </div>
  <div class="controls">
    <button data-range="24"></button><button data-range="60"></button><button data-range="all"></button>
    <button id="lang">English</button>
  </div>
</header>
<main>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
</main>
<footer id="footer"></footer>

<script>
const T = {
  ja: { title: "名古屋 物価トラッカー", subtitle: "名古屋市の生活必需品の小売価格の推移(月次)", per: "あたり",
        r24: "2年", r60: "5年", rall: "全期間", yoy: "前年同月比", noData: "データはまだありません。GitHub Action の初回実行後に表示されます。",
        source: "出典", updated: "更新", toggle: "English" },
  en: { title: "Nagoya Price Tracker", subtitle: "Monthly retail prices of everyday essentials in Nagoya", per: "per",
        r24: "2 yrs", r60: "5 yrs", rall: "All", yoy: "vs. last year", noData: "No data yet. It will appear after the first GitHub Action run.",
        source: "Source", updated: "Updated", toggle: "日本語" },
};
let lang = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })()
  || (navigator.language.startsWith("ja") ? "ja" : "en");
let range = "60";
let data = null;
const charts = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const yen = v => "¥" + Math.round(v).toLocaleString();

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-range]").forEach(b => {
    b.textContent = t["r" + b.dataset.range];
    b.setAttribute("aria-pressed", b.dataset.range === range);
  });
  document.getElementById("lang").textContent = t.toggle;
  charts.splice(0).forEach(c => c.destroy());
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!data || !data.items.length) {
    document.getElementById("legend").innerHTML = "";
    grid.innerHTML = `<div class="empty">${t.noData}</div>`;
    document.getElementById("footer").textContent = "";
    return;
  }

  const color = id => css(id === "nagoya" ? "--nagoya" : "--tokyo");
  document.getElementById("legend").innerHTML = data.areas.length < 2 ? "" : data.areas.map(a =>
    `<span><span class="swatch" style="background:${color(a.id)}"></span>${a["name_" + lang]}</span>`).join("");

  for (const item of data.items) {
    const main = item.series.nagoya || Object.values(item.series)[0] || [];
    if (!main.length) continue;
    const [lastMonth, last] = main[main.length - 1];
    const prevYear = String(+lastMonth.slice(0, 4) - 1) + lastMonth.slice(4);
    const ago = main.find(p => p[0] === prevYear);
    const pct = ago ? (last / ago[1] - 1) * 100 : null;
    const chg = pct === null ? "" :
      `<span class="chg ${pct > 0 ? "up" : pct < 0 ? "down" : ""}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}% ${t.yoy}</span>`;

    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2>${item["name_" + lang]}</h2>
      <div class="unit">${lang === "ja" ? `${item.unit_ja}${t.per}` : `${t.per} ${item.unit_en}`}${item["note_" + lang] ? ` · ${item["note_" + lang]}` : ""}</div>
      <div class="price"><strong>${yen(last)}</strong>${chg}</div>
      <div class="unit">${lastMonth}</div>
      <div class="chart"><canvas></canvas></div>`;
    grid.appendChild(card);

    const months = [...new Set(Object.values(item.series).flat().map(p => p[0]))].sort();
    const shown = range === "all" ? months : months.slice(-Number(range));
    charts.push(new Chart(card.querySelector("canvas"), {
      type: "line",
      data: {
        labels: shown,
        datasets: data.areas.filter(a => item.series[a.id]).map(a => {
          const m = new Map(item.series[a.id]);
          return { label: a["name_" + lang], data: shown.map(x => m.get(x) ?? null),
                   borderColor: color(a.id), borderWidth: a.id === "nagoya" ? 2 : 1.25,
                   pointRadius: 0, spanGaps: true, tension: 0.2 };
        }),
      },
      options: {
        maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
        scales: {
          x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
          y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
        },
      },
    }));
  }
  const s = data.source;
  document.getElementById("footer").innerHTML =
    `${t.source}: ${s["name_" + lang]} (<a href="https://www.e-stat.go.jp/">e-Stat</a>) · ${t.updated}: ${data.updated.slice(0, 10)}`;
}

document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { range = b.dataset.range; render(); });
document.getElementById("lang").onclick = () => {
  lang = lang === "ja" ? "en" : "ja";
  try { localStorage.setItem("lang", lang); } catch {}
  render();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

fetch("data/prices.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : null)
  .catch(() => null)
  .then(d => { data = d; render(); });
</script>
</body>
</html>
