function monthsBack(m, n) {
  const total = +m.slice(0, 4) * 12 + (+m.slice(5, 7) - 1) - n;
  return `${Math.floor(total / 12)}-${String(total % 12 + 1).padStart(2, "0")}`;

  const pct = (now / before - 1) * 100;
  const cls = pct > 0.05 ? "up" : pct < -0.05 ? "down" : "";
  return `<span class="chg ${cls}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%${label ? " " + label : ""}</span>`;
}

// ---------- Custom basket
function defaultBasket() {
  return { adults: basket.household.adults, children: basket.household.children,
           items: Object.fromEntries(Object.entries(basket.items).filter(([, v]) => v.default != null).map(([k, v]) => [k, v.default])) };
}
// Accept only known items and sane numbers from storage or a share link.
function cleanBasket(b) {
  if (!b || typeof b !== "object") return null;
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi ? v : null;
  const adults = int(b.adults, 0, 20), children = int(b.children, 0, 20);
  if (adults == null || children == null || !b.items || typeof b.items !== "object") return null;
  const items = {};
  for (const [k, v] of Object.entries(b.items)) {
    if (basket.items[k] && typeof v === "number" && Number.isFinite(v) && v > 0 && v < 1e6) items[k] = v;
  }
  return { adults, children, items };
}
const b64url = str => btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64url = str => atob(str.replace(/-/g, "+").replace(/_/g, "/"));
function loadBasket() {
  const h = location.hash.match(/[#&]b=([A-Za-z0-9_-]+)/);
  if (h) {
    try { const b = cleanBasket(JSON.parse(unb64url(h[1]))); if (b) { sharedView = true; return b; } } catch {}
  }
  try { const b = cleanBasket(JSON.parse(localStorage.getItem(BASKET_KEY))); if (b) return b; } catch {}
  return defaultBasket();
}

const scaleOf = id => basket.items[id]?.fixed ? 1 : (multiplier() || 1);

// Monthly cost of the custom basket. Seasonal items reuse their last in-season price for up to 11 months;
// months before an item's series starts are left out.
function basketSeries() {
  const mult = multiplier();
  // items this city doesn't survey are left out
  const parts = data.items.filter(i => basket.items[i.id] && myBasket.items[i.id] > 0 && seriesOf(i).length).map(i => ({
    item: i, amount: myBasket.items[i.id] * scaleOf(i.id), units: myBasket.items[i.id] * scaleOf(i.id) * basket.items[i.id].per,
    own: new Map(seriesOf(i)), prices: new Map(), carried: new Set(),
  }));
  if (!parts.length || mult <= 0) return { parts, points: [] };
  const months = [...new Set(parts.flatMap(p => [...p.own.keys()]))].sort();
  for (const p of parts) {
    let last = null, lastK = -99;
    months.forEach((m, k) => {
      if (p.own.has(m)) { last = p.own.get(m); lastK = k; p.prices.set(m, last); }
      else if (last != null && k - lastK <= 11) { p.prices.set(m, last); p.carried.add(m); }
    });
  }
  const points = [];
  for (const m of months) {
    if (parts.every(p => p.prices.has(m))) points.push([m, parts.reduce((sum, p) => sum + p.units * p.prices.get(m), 0)]);
  }
  return { parts, points };
}

const cpiIdx = (kind = "food") => cpi?.series?.[kind]?.points?.length ? new Map(cpi.series[kind].points) : null;
const cpiFood = () => cpiIdx("food");
// Food items are compared with food CPI; utilities and household goods with overall CPI.
const NON_FOOD = new Set(["utilities", "household"]);
const cpiKindForItem = item => NON_FOOD.has(item.category) && cpiIdx("all") ? "all" : "food";
const cpiKindForBasket = () => cpiIdx("all") && data.items.some(i => NON_FOOD.has(i.category) && myBasket.items[i.id] > 0) ? "all" : "food";

// Where a price would be if it had moved with CPI since the first shown month that has both values.
function cpiPath(labels, values, kind) {
  const idx = cpiIdx(kind);
  if (!idx) return null;
  const k = labels.findIndex((m, i) => values[i] != null && idx.has(m));
  if (k < 0) return null;
  const base = values[k] / idx.get(labels[k]);
  return labels.map((m, i) => i < k || !idx.has(m) ? null : base * idx.get(m));
}
const refDataset = (labels, values, label, kind) => {
  const path = cpiPath(labels, values, kind);
  return path ? [{ label, data: path, borderColor: css("--muted"), borderWidth: 1.25, borderDash: [4, 4],
                   pointRadius: 0, spanGaps: true, tension: 0.2 }] : [];
};

function lineChart(canvas, labels, values, label, refLabel, kind) {
  return new Chart(canvas, {
    type: "line",
    data: { labels, datasets: [{ label, data: values, borderColor: css("--nagoya"), borderWidth: 2,
                                 pointRadius: 0, spanGaps: true, tension: 0.2 },
                               ...(refLabel ? refDataset(labels, values, refLabel, kind) : [])] },
    options: {
      maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false },
                 tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
      scales: {
        x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
        y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
      },
    },
  });
}

// CPI change over the same windows as the basket chips, ending in the same month.
function cpiChips(m, t, kind) {
  const idx = cpiIdx(kind);
  if (!idx || !idx.has(m)) return "";
  const c = (label, n) => idx.has(monthsBack(m, n))
    ? `<div class="chip"><span>${label}</span>${pctSpan(idx.get(m), idx.get(monthsBack(m, n)))}</div>` : "";
  return `<div class="chips cpi"><div class="chip" style="border:none;padding-left:0"><span>${t.cpiRef(kind)}</span></div>${c(t.mom, 1)}${c(t.y1, 12)}${c(t.y5, 60)}</div>`;
}

// ---------- Seasonal patterns (factors per calendar month from prices.json)
const SEASON_MIN = 0.10;  // only show patterns with at least a 10% swing
const seasonal = item => item.seasonal && item.seasonal.amplitude >= SEASON_MIN ? item.seasonal.factors : null;
const thisMonth0 = () => Number(new Intl.DateTimeFormat("en", { timeZone: "Asia/Tokyo", month: "numeric" }).format(new Date())) - 1;
const shortMonth = (m, t) => lang === "ja" ? `${+m.slice(5)}月` : t.monthFull(+m.slice(5) - 1).slice(0, 3);
const joinMonths = (ks, t) => ks.map(k => lang === "ja" ? `${k + 1}月` : t.monthFull(k).slice(0, 3)).join(lang === "ja" ? "・" : ", ");

function seasonStrip(item, main, t) {
  const f = seasonal(item);
  if (!f) return "";
  const vals = f.filter(v => v != null), lo = Math.min(...vals), hi = Math.max(...vals);
  const now0 = thisMonth0();
  const bars = f.map((v, k) => v == null ? `<span class="na" title="—"></span>` :
    `<span class="${v <= 0.95 ? "lo" : v >= 1.05 ? "hi" : ""}${k === now0 ? " now" : ""}" style="height:${(4 + 26 * (v - lo) / (hi - lo || 1)).toFixed(0)}px"
      title="${lang === "ja" ? `${k + 1}月` : t.monthFull(k)}: ${v >= 1 ? "+" : ""}${((v - 1) * 100).toFixed(0)}%"></span>`).join("");
  const cheap = f.map((v, k) => [v, k]).filter(([v]) => v != null && v <= lo + 0.03).map(([, k]) => k).slice(0, 3);
  const dear = f.map((v, k) => [v, k]).filter(([v]) => v != null && v >= hi - 0.03).map(([, k]) => k).slice(0, 3);
  // Latest price with the season removed, against the average of the previous 12 months, also deseasonalised.
  let nowLine = "";
  const de = main.map(([m, v]) => [m, f[+m.slice(5) - 1] ? v / f[+m.slice(5) - 1] : null]).filter(([, v]) => v != null);
  if (de.length > 12) {
    const [mNow, vNow] = de[de.length - 1];
    const prev = de.slice(-13, -1).map(([, v]) => v);
    const dev = (vNow / (prev.reduce((a, b) => a + b, 0) / prev.length) - 1) * 100;
    nowLine = Math.abs(dev) < 3 ? t.nowUsual(shortMonth(mNow, t)) : t.nowVsUsual(shortMonth(mNow, t), dev);
  }
  return `<div class="season"><div class="bars">${bars}</div>
    <div class="bar-labels">${t.monthNames.map(n => `<span>${n}</span>`).join("")}</div>
    <p>${t.cheapest}: ${joinMonths(cheap, t)} · ${t.dearest}: ${joinMonths(dear, t)}</p>
    ${nowLine ? `<p>${nowLine}</p>` : ""}</div>`;
}

// ---------- Coming up (docs/data/outlook.json, MAFF vegetable outlook)
function verdictParts(v) {
  // One line per period ("11月前半: … / 11月後半: …" becomes two lines), worded briefly.
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return v.verdict_ja.split(/\s*\/\s*/).map(part => lang === "ja"
    ? part.replace(/\d+月(前半|後半)/g, "$1").replace(/(上回|下回)って推移/g, "$1る").replace(/平年並みで推移/g, "平年並み")
    : part.replace(/(\d+)月前半/g, (_, m) => `early ${months[m - 1]}`).replace(/(\d+)月後半/g, (_, m) => `late ${months[m - 1]}`)
        .replace(/やや平年を上回って推移/g, "slightly above normal").replace(/平年を上回って推移/g, "above normal")
        .replace(/やや平年を下回って推移/g, "slightly below normal").replace(/平年を下回って推移/g, "below normal")
        .replace(/平年並みで推移/g, "normal"));
}
function renderOutlook(t) {
  const box = document.getElementById("outlook");
  const items = Object.entries(outlook?.items || {}).map(([id, v]) => ({ id, v, item: data.items.find(i => i.id === id) })).filter(r => r.item);
  if (!items.length) { box.hidden = true; return; }
  const m = outlook.edition, mo = +m.slice(5);
  const title = lang === "ja" ? `${m.slice(0, 4)}年${mo}月` : `${t.monthFull(mo - 1)} ${m.slice(0, 4)}`;
  const up = items.filter(r => r.v.score >= 0.5).sort((a, b) => b.v.score - a.v.score);
  const down = items.filter(r => r.v.score <= -0.5).sort((a, b) => a.v.score - b.v.score);
  const normal = items.filter(r => Math.abs(r.v.score) < 0.5);
  const row = (r, cls) => `<details class="ol-row"><summary><span class="ol-name">${esc(r.item["name_" + lang])}</span>
      <span class="chg ol-v ${cls}">${verdictParts(r.v).map(x => `<span>${esc(x)}</span>`).join("")}</span></summary>
      <p>${esc(lang === "en" && r.v.reason_en ? r.v.reason_en : r.v.reason_ja)}${lang === "en" && !r.v.reason_en ? `<span class="unit">${t.reasonJaOnly}</span>` : ""}</p></details>`;
  // Rough basket effect: scale the track record's median retail move by the strength of the call.
  const tr = outlook.track_record || {};
  let impact = 0;
  if (basket && myBasket && tr.up?.median_change != null && tr.down?.median_change != null) {
    for (const r of [...up, ...down]) {
      const amount = myBasket.items[r.id];
      const last = latestPrice(r.item);
      if (!amount || last == null) continue;
      const cost = amount * scaleOf(r.id) * basket.items[r.id].per * last;
      impact += cost * (r.v.score > 0 ? tr.up.median_change : -tr.down.median_change) * Math.min(Math.abs(r.v.score), 2) / 2 * Math.sign(r.v.score);
    }
  }
  const safe = /^https:\/\//.test(outlook.source_url || "") ? esc(outlook.source_url) : "#";
  box.innerHTML = `<h2>${t.outlookTitle(title)}</h2><div class="unit">${t.outlookSub}</div>
    <div class="guide-cols">
      <div><h3>${t.likelyUp}</h3>${up.length ? up.map(r => row(r, "up")).join("") : "<p class='unit'>–</p>"}</div>
      <div><h3>${t.likelyDown}</h3>${down.length ? down.map(r => row(r, "down")).join("") : "<p class='unit'>–</p>"}</div>
    </div>
    ${normal.length ? `<p class="unit" style="margin:10px 0 0">${t.nearNormal}: ${normal.map(r => esc(r.item["name_" + lang])).join(lang === "ja" ? "、" : ", ")}</p>` : ""}
    ${Math.abs(impact) >= 10 ? `<p style="margin:10px 0 0">${t.basketImpact(Math.round(impact / 10) * 10)}</p>` : ""}
    ${tr.calls ? `<p class="note">${t.trackRecord(tr)}</p>` : ""}
    <p class="note">${t.outlookNote} <a href="${safe}" target="_blank" rel="noopener noreferrer">${t.sourceLbl}</a></p>`;
  box.hidden = false;
}

function newsFor(itemId) {

    <ul class="news">${items}
    ${(info.official || []).map(o => `<li><span class="meta">${t.official}: </span><a href="${safeUrl(o.url)}" target="_blank" rel="noopener noreferrer">${esc(o["title_" + lang])}</a></li>`).join("")}
  </ul><p class="note" style="margin:0 0 6px">${summary ? t.explainNote : t.newsNote}</p>`;
}

// ---------- Prices and pay
// Yearly average of monthly points, for years with at least 10 months.
function yearlyAvg(points) {
  const by = new Map();
  for (const [m, v] of points) { const y = +m.slice(0, 4); (by.get(y) || by.set(y, []).get(y)).push(v); }
  return new Map([...by].filter(([, vs]) => vs.length >= 10).map(([y, vs]) => [y, vs.reduce((a, b) => a + b, 0) / vs.length]));
}
// Pay by industry or job for a prefecture (or "全国"): loaded once, then the section redraws.
function wageFile(pref) {
  const code = wageCatalog?.prefs?.[pref];
  if (!code) return {};
  if (!(code in wageFiles)) {
    wageFiles[code] = null;
    load(`data/wages/${code}.json`).then(f => { wageFiles[code] = f || {}; renderWages(T[lang]); });
  }
  return wageFiles[code];
}
function jobOptions(t, local, nat) {
  const has = (f, id) => (f?.series?.[id]?.length || 0) >= 2;
  const name = e => e[lang] || e.ja;
  const opt = (e, label) => {
    const here = !local || has(local, e.id), there = e.kind === "job" && has(nat, e.id);
    if (!here && !there) return "";
    return `<option value="${esc(e.id)}"${e.id === wageJob ? " selected" : ""}>${esc(label)}${here ? "" : t.nationalTag}</option>`;
  };
  const entries = wageCatalog?.entries || [];
  const inds = entries.filter(e => e.kind === "industry").map(e => opt(e, (e.parent ? "– " : "") + name(e))).join("");
  const groups = entries.filter(e => e.kind === "job" && !e.parent).map(g => {
    const inner = opt(g, t.groupAll(name(g))) + entries.filter(e => e.parent === g.id).map(e => opt(e, name(e))).join("");
    return inner ? `<optgroup label="${esc(name(g))}">${inner}</optgroup>` : "";
  }).join("");
  return `<option value="">${t.allWorkers}</option>${inds ? `<optgroup label="${t.industryGroup}">${inds}</optgroup>` : ""}${groups}`;
}
function renderWages(t) {
  const box = document.getElementById("wages");
  wageCharts.splice(0).forEach(c => c.destroy());
  const prefPoints = wages?.prefs?.[cur.pref] || (cur.pref === "愛知県" ? wages?.points : null);
  // The chosen industry or job, from this prefecture or (jobs only) the national figure
  const local = wageCatalog ? wageFile(cur.pref) : null, nat = wageCatalog ? wageFile("全国") : null;
  const entry = wageCatalog?.entries?.find(e => e.id === wageJob);
  let sel = null;
  if (entry) {
    const mine = local?.series?.[entry.id], all = entry.kind === "job" ? nat?.series?.[entry.id] : null;
    if (mine?.length >= 2) sel = { ...entry, points: mine, national: false };
    else if (all?.length >= 2) sel = { ...entry, points: all, national: true };
  }
  const pay = new Map(sel ? sel.points : prefPoints || []);
  // Short name for chips and the legend: drop a trailing "(…)" detail, which stays in the menu and note
  const short = n => n.replace(/\s*[（(][^（()）]*[)）]$/, "");
  const who = t.payWho(sel ? short(sel[lang] || sel.ja) : null, sel?.national);
  const all = yearlyAvg(cpi?.series?.all?.points || []), food = yearlyAvg(cpi?.series?.food?.points || []);
  const bpts = basket && myBasket ? basketSeries().points : [];
  const bask = yearlyAvg(bpts);
  const years = [...pay.keys()].filter(y => y >= 2015 && all.has(y)).sort();
  if (years.length < 2) { box.hidden = true; return; }
  const y0 = years[0], y1 = years[years.length - 1];
  const idx = (map, y) => map.has(y) && map.has(y0) ? map.get(y) / map.get(y0) * 100 : null;
  const pct = map => map.has(y1) && map.has(y0) ? (map.get(y1) / map.get(y0) - 1) * 100 : null;
  const rows = [[t.pay(who), pay, css("--down")], [t.basketLine, bask, css("--nagoya")], [t.cpiAllLine, all, css("--muted")], [t.cpiFoodLine, food, css("--tokyo")]];
  const real = pct(pay) != null && pct(all) != null ? ((1 + pct(pay) / 100) / (1 + pct(all) / 100) - 1) * 100 : null;
  const latestBasket = bpts.length ? bpts[bpts.length - 1][1] : null;
  const wy = Math.max(...pay.keys());
  box.innerHTML = `<h2>${t.wagesTitle}</h2><div class="unit">${t.wagesSub(y0, y1)}</div>
    ${wageCatalog ? `<label class="city-pick job-pick">${t.jobPick} <select>${jobOptions(t, local, nat)}</select></label>` : ""}
    <div class="chips" style="margin-top:10px">${rows.map(([label, map]) => pct(map) == null ? "" :
      `<div class="chip"><span>${label}</span>${map === pay  // for pay, a rise is good news: swap the colours
        ? pctSpan(map.get(y1), map.get(y0)).replace(/chg (up|down)/, (_, c) => `chg ${c === "up" ? "down" : "up"}`)
        : pctSpan(map.get(y1), map.get(y0))}</div>`).join("")}</div>
    <div class="chart tall"><canvas></canvas></div>
    ${real != null ? `<p style="margin:8px 0 0"><b class="chg ${real < 0 ? "up" : "down"}" style="font-size:1rem">${t.realPay(real)}</b></p>` : ""}
    ${latestBasket ? `<p class="unit" style="margin:4px 0 0">${t.payShare(latestBasket / (pay.get(wy) * 1000) * 100, wy, who)}</p>` : ""}
    <p class="note">${t.wagesNote(wy, sel)}</p>`;
  box.hidden = false;
  box.querySelector(".job-pick select")?.addEventListener("change", e => {
    wageJob = e.target.value;
    try { localStorage.setItem("wageJob", wageJob); } catch {}
    renderWages(T[lang]);
  });
  wageCharts.push(new Chart(box.querySelector("canvas"), {
    type: "line",
    data: { labels: years, datasets: rows.filter(([, map]) => map.has(y0)).map(([label, map, color], k) => ({
      label, data: years.map(y => idx(map, y)), borderColor: color, borderWidth: k < 2 ? 2.25 : 1.25,
      borderDash: k === 2 ? [4, 4] : k === 3 ? [2, 3] : [], pointRadius: k === 0 ? 3 : 0, spanGaps: true, tension: 0.15 })) },
    options: {
      maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: true, position: "bottom", labels: { color: css("--muted"), boxWidth: 14, boxHeight: 2 } },
                 tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y?.toFixed(1)}` } } },
      scales: { x: { ticks: { color: css("--muted") }, grid: { display: false } },
                y: { ticks: { color: css("--muted"), maxTicksLimit: 5 }, grid: { color: css("--line") } } },
    },
  }));
}

// ---------- Menu
function renderMenu(t) {
  const links = [];
  const add = (id, label, sub) => { if (document.getElementById(id) && !document.getElementById(id).hidden) links.push(
    `<a href="#${id}" class="${sub ? "sub-link" : ""}" data-jump="${id}">${esc(label)}</a>`); };
  if (basket && myBasket) add("basket-slot", sameAsDefault() && !sharedView ? basket["name_" + lang] : t.myBasket);
  add("movers", t.movers);
  add("guide", document.querySelector("#guide h2")?.textContent || "");
  if (document.getElementById("make-it-last")) add("make-it-last", t.makeItLast, true);
  add("outlook", document.querySelector("#outlook h2")?.textContent || "");
  add("wages", t.wagesTitle);
  add("items", t.allItems);
  if (sortBy === "category") for (const c of data?.categories || []) add(`cat-${c.id}`, c["name_" + lang], true);
  document.getElementById("menu-jump").innerHTML = links.join("");
}
function toggleMenu(open) {
  const menu = document.getElementById("menu"), btn = document.getElementById("menu-btn");
  menu.hidden = open === undefined ? !menu.hidden : !open;
  btn.setAttribute("aria-expanded", String(!menu.hidden));
  if (!menu.hidden) menu.querySelector("a, button")?.focus({ preventScroll: true });
}
document.getElementById("menu-btn").onclick = e => { e.stopPropagation(); toggleMenu(); };
document.getElementById("menu-close").onclick = () => { toggleMenu(false); document.getElementById("menu-btn").focus(); };
document.getElementById("menu").addEventListener("click", e => {
  e.stopPropagation();
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    e.preventDefault();
    toggleMenu(false);
    document.getElementById(jump.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const tool = e.target.closest("[data-tool]");
  if (tool) {
    toggleMenu(false);
    if (tool.dataset.tool === "check") { toggleChecker(true); document.getElementById("checker").scrollIntoView({ behavior: "smooth", block: "start" }); }
    else toggleEditor(true);
  }
});
document.addEventListener("click", () => { if (!document.getElementById("menu").hidden) toggleMenu(false); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("menu").hidden) { toggleMenu(false); document.getElementById("menu-btn").focus(); }
});
document.getElementById("to-top").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// ---------- Price checker
const CHECK_KEY = "check.v1";
function toggleChecker(open) {
  const box = document.getElementById("checker");
  box.hidden = open === undefined ? !box.hidden : !open;
  document.getElementById("check-btn").setAttribute("aria-expanded", String(!box.hidden));
  if (!box.hidden) { renderChecker(); box.querySelector("#ck-price")?.focus(); }
}
function renderChecker() {
  const box = document.getElementById("checker");
  if (box.hidden || !data || !basket) return;
  const t = T[lang];
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(CHECK_KEY)) || {}; } catch {}
  const items = data.items.filter(i => basket.items[i.id] && seriesOf(i).length);
  const cur = items.find(i => i.id === saved.id) || items.find(i => i.id === "eggs") || items[0];
  const cats = data.categories || [];
  const opts = cats.map(c => {
    const list = items.filter(i => i.category === c.id);
    return list.length ? `<optgroup label="${esc(c["name_" + lang])}">${list.map(i =>
      `<option value="${i.id}" ${i === cur ? "selected" : ""}>${esc(i["name_" + lang])}</option>`).join("")}</optgroup>` : "";
  }).join("");
  box.innerHTML = `<div class="card-head"><h2>${t.checkTitle}</h2><button class="btn-sm" id="ck-close">${t.close}</button></div>
    <div class="check-form">
      <label class="f-item">${t.checkItem}<select id="ck-item">${opts}</select></label>
      <label>${t.checkPrice}<span class="with-unit"><span>¥</span><input id="ck-price" type="number" inputmode="decimal" min="0" step="1"></span></label>
      <label>${t.checkQty}<span class="with-unit"><input id="ck-qty" type="number" inputmode="decimal" min="0"><span id="ck-unit"></span></span></label>
    </div>
    <div id="ck-result"></div>`;
  const sel = box.querySelector("#ck-item"), price = box.querySelector("#ck-price"), qty = box.querySelector("#ck-qty");
  const setItem = (keepQty) => {
    const item = data.items.find(i => i.id === sel.value), spec = basket.items[item.id];
    box.querySelector("#ck-unit").textContent = spec["input_" + lang];
    qty.step = spec.step;
    if (!keepQty) qty.value = fmtQty(1 / spec.per);  // one survey unit, e.g. 10 eggs or 5 kg of rice
    update();
  };
  const update = () => {
    const item = data.items.find(i => i.id === sel.value), spec = basket.items[item.id];
    try { localStorage.setItem(CHECK_KEY, JSON.stringify({ id: item.id })); } catch {}
    const out = box.querySelector("#ck-result");
    const pr = Number(price.value), q = Number(qty.value);
    const s = seriesOf(item), [m, avg] = s[s.length - 1];
    const last12 = s.slice(-12).map(p => p[1]), lo = Math.min(...last12), hi = Math.max(...last12);
    const unitName = item["unit_" + lang] || spec["input_" + lang];
    if (!(pr > 0 && q > 0)) {
      out.innerHTML = `<p class="note" style="margin-top:12px">${t.avgLabel(m)}: <b>${yen(avg)}</b> ${t.checkPer(esc(unitName))} ·
        ${t.lowLabel} ${yen(lo)} · ${t.highLabel} ${yen(hi)}</p><p class="note">${t.checkNote}</p>`;
      return;
    }
    const yours = pr / (q * spec.per);  // price per survey unit
    const diff = (yours / avg - 1) * 100;
    const [cls, verdict] = yours < lo ? ["good", t.vLow] : diff <= -5 ? ["good", t.vGood] : diff < 5 ? ["", t.vAvg]
                         : yours > hi ? ["bad", t.vTop] : ["bad", t.vHigh];
    const a = Math.min(lo, yours, avg) * 0.97, b = Math.max(hi, yours, avg) * 1.03;
    const x = v => `${((v - a) / (b - a) * 100).toFixed(1)}%`;
    out.innerHTML = `<div class="verdict"><div class="v ${cls}">${verdict}</div>
        <div>${yen(yours)} ${t.checkPer(esc(unitName))} · ${t.vsAvg(diff)}</div></div>
      <div class="range" aria-hidden="true">
        <div style="position:absolute;left:${x(lo)};width:calc(${x(hi)} - ${x(lo)});height:100%;background:var(--muted);opacity:.35;border-radius:4px"></div>
        <div class="avg" style="left:${x(avg)}"></div><span class="lbl top" style="left:${x(avg)}">${t.avgLabel(m)} ${yen(avg)}</span>
        <div class="you" style="left:${x(yours)}"></div>
        <span class="lbl" style="left:${x(lo)}">${yen(lo)}</span><span class="lbl" style="left:${x(hi)}">${yen(hi)}</span>
      </div>
      <p class="note">${t.lowLabel} ${yen(lo)} – ${t.highLabel} ${yen(hi)}. ${t.checkNote}</p>`;
  };
  sel.onchange = () => setItem(false);
  price.oninput = update;
  qty.oninput = update;
  box.querySelector("#ck-close").onclick = () => toggleChecker(false);
  setItem(false);
}

function renderSummary(t) {
  const box = document.getElementById("summary");
  box.innerHTML = "";
  if (!data || !data.items.length) return;

  // ---- Basket card (rendered separately so editing doesn't redraw every chart)
  if (basket && myBasket) {
    const slot = document.createElement("div");
    slot.id = "basket-slot";
    box.appendChild(slot);
    renderBasket(t);
  }

  // ---- Biggest changes card
  const latest = data.items.map(seriesOf).filter(s => s.length).map(s => s[s.length - 1][0]).sort().pop();
  const changes = n => data.items.map(i => {
    const m = new Map(seriesOf(i));
    const now = m.get(latest), before = m.get(monthsBack(latest, n));
    return now != null && before ? { i, now, before, pct: (now / before - 1) * 100 } : null;
  }).filter(Boolean);
  const list = (rows, label) => rows.length ? `<h3>${label}</h3><ol>${rows.map(r => {
      const info = newsFor(r.i.id);
      return info
        ? `<li class="has-news"><details><summary><span>${esc(r.i["name_" + lang])}<span class="why">${t.why}</span></span>${pctSpan(r.now, r.before)}</summary>${newsList(info, t)}</details></li>`
        : `<li><span>${esc(r.i["name_" + lang])}</span>${pctSpan(r.now, r.before)}</li>`;
    }).join("")}</ol>` : "";
  const block = (title, n) => {
    const c = changes(n).sort((a, b) => b.pct - a.pct);
    const ups = c.filter(r => r.pct > 0.05).slice(0, 3);
    const downs = c.filter(r => r.pct < -0.05).reverse().slice(0, 3);
    const idx = cpiFood();
    const base = idx && idx.has(latest) && idx.has(monthsBack(latest, n))
      ? ` <span class="unit" style="font-weight:400">(${t.baseline} ${pctSpan(idx.get(latest), idx.get(monthsBack(latest, n)))})</span>` : "";
    return `<h3 style="color:var(--text);font-weight:600">${title}${base}</h3>` +
      (ups.length || downs.length ? list(ups, t.up) + list(downs, t.down) : `<p class="unit">${t.noMoves}</p>`);
  };
  const movers = document.createElement("section");
  movers.className = "card movers";
  movers.id = "movers";
  movers.innerHTML = `<h2>${t.movers}</h2><div class="unit">${latest}</div>
    ${block(t.sinceMonth, 1)}${block(t.sinceYear, 12)}`;
  box.appendChild(movers);
}

function render() {
  document.title = `${T.ja.title} | ${T.en.title}`;
  renderCityPickers();
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-range]").forEach(b => {
    b.textContent = t["r" + b.dataset.range];
    b.setAttribute("aria-pressed", b.dataset.range === range);
  });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("menu-btn").textContent = t.menu;
  charts.splice(0).forEach(c => c.destroy());
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("check-btn").textContent = t.check;
  renderSummary(t);
  renderEditor();

  if (!data || !data.items.length) {
    document.getElementById("legend").innerHTML = "";
    grid.innerHTML = `<div class="empty">${t.noData}</div>`;
    document.getElementById("footer").textContent = "";
    return;
  }
  renderGuide(t);
  renderOutlook(t);
  renderWages(t);
  renderChecker();

  const color = id => css(id === "local" ? "--nagoya" : "--tokyo");
  document.getElementById("legend").innerHTML = (chartAreas().length < 2 ? "" : chartAreas().map(a =>
    `<span><span class="swatch" style="background:${color(a.id)}"></span>${a["name_" + lang]}</span>`).join("")) +
    (cpiFood() ? `<span><span class="swatch" style="background:none;border-top:2px dashed var(--muted);height:0"></span>${t.cpiLegend}</span>` : "");

  document.querySelectorAll("[data-sort]").forEach(b => {
    b.textContent = t["sort_" + b.dataset.sort];
    b.setAttribute("aria-pressed", b.dataset.sort === sortBy);
  });

  // Latest price and year-on-year change for each item, then order them.
  const rows = data.items.map(item => {
    const main = seriesOf(item);
    if (!main.length) return null;
    const [lastMonth, last] = main[main.length - 1];
    const before = new Map(main).get(monthsBack(lastMonth, 12));
    return { item, main, lastMonth, last, before, pct: before ? last / before - 1 : null };
  }).filter(Boolean);
  const cats = data.categories || [];
  const catIndex = id => { const i = cats.findIndex(c => c.id === id); return i < 0 ? cats.length : i; };
  if (sortBy === "category") rows.sort((a, b) => catIndex(a.item.category) - catIndex(b.item.category));
  else {
    const dir = sortBy === "up" ? -1 : 1;
    rows.sort((a, b) => (a.pct == null) - (b.pct == null) || dir * (a.pct - b.pct));
  }

  let currentCat;
  for (const { item, main, lastMonth, last, before } of rows) {
    if (sortBy === "category" && item.category !== currentCat) {
      currentCat = item.category;
      const c = cats.find(c => c.id === currentCat);
      const h = document.createElement("h3");
      h.className = "cat-title";
      h.id = `cat-${currentCat}`;
      h.textContent = c ? c["name_" + lang] : t.other;
      grid.appendChild(h);
    }
    const chg = pctSpan(last, before, t.yoy);
    const nat = item.series.national ? new Map(item.series.national).get(lastMonth) : null;
    const natDiff = nat ? (last / nat - 1) * 100 : null;
    const natLine = natDiff == null ? "" : Math.abs(natDiff) < 2 ? t.sameNational : t.vsNational(natDiff);
    const unit = item["unit_" + lang] ? (lang === "ja" ? `${item.unit_ja}${t.per}` : `${t.per} ${item.unit_en}`) : "";
    const sub = [unit, item["note_" + lang]].filter(Boolean).join(" · ");

    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2>${item["name_" + lang]}</h2>
      <div class="unit">${sub || "&nbsp;"}</div>
      <div class="price"><strong>${yen(last)}</strong>${chg}</div>
      <div class="unit">${lastMonth}${natLine ? ` · ${natLine}` : ""}</div>
      <div class="chart"><canvas></canvas></div>
      ${seasonStrip(item, main, t)}
      ${(info => info ? `<details class="news-box"><summary>${t.relatedNews((info.headlines || []).length)}</summary>${newsList(info, t)}</details>` : "")(newsFor(item.id))}
      ${(gs => gs.length ? `<details class="keep-box"><summary>${t.keepCount(gs.length)}</summary>${gs.map(g => keepHtml(g, t)).join("")}${safetyHtml(t)}</details>` : "")(guidesFor(item.id))}`;
    grid.appendChild(card);

    const months = [...new Set(Object.values(item.series).flat().map(p => p[0]))].sort();
    const shown = range === "all" ? months : months.slice(-Number(range));
    charts.push(new Chart(card.querySelector("canvas"), {
      type: "line",
      data: {
        labels: shown,
        datasets: [...chartAreas().filter(a => item.series[a.id]).map(a => {
          const m = new Map(item.series[a.id]);
          return { label: a["name_" + lang], data: shown.map(x => m.get(x) ?? null),
                   borderColor: color(a.id), borderWidth: a.id === "local" ? 2 : 1.25,
                   pointRadius: 0, spanGaps: true, tension: 0.2 };
        }), ...refDataset(shown, shown.map(x => new Map(main).get(x) ?? null), t.ifCpi(cpiKindForItem(item)), cpiKindForItem(item))],
      },
      options: {
        maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: c => `${c.dataset.label}: ${yen(c.parsed.y)}` } } },
        scales: {
          x: { ticks: { maxTicksLimit: 5, color: css("--muted") }, grid: { display: false } },
          y: { ticks: { maxTicksLimit: 4, color: css("--muted"), callback: v => yen(v) }, grid: { color: css("--line") } },
        },
      },
    }));
  }
  const s = data.source;
  document.getElementById("footer").innerHTML =
    `${t.source}: ${s["name_" + lang]}${cpi ? "; " + cpi.source["name_" + lang] : ""} (<a href="https://www.e-stat.go.jp/">e-Stat</a>) · ${t.updated}: ${data.updated.slice(0, 10)}`;
  renderMenu(t);  // last, so the category headings exist
}

};

const load = url => fetch(url, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
// Each city has its own page (docs/<id>/index.html, built by fetch/build_pages.py); choosing a city goes there.
const cityPageUrl = id => new URL(id === DEFAULT_CITY.id ? "./" : `${encodeURIComponent(id)}/`, document.baseURI).href;
document.querySelectorAll("[data-city-select]").forEach(sel => sel.onchange = () => {
  toggleMenu(false);
  try { localStorage.setItem("city", sel.value); } catch {}
  location.href = cityPageUrl(sel.value) + location.hash.replace(/^#b=.*/, "");
});
Promise.all([load("data/prices.json"), load("basket.json"), load("data/cpi.json"), load("data/wages.json"), load("data/insights.json"), load("preserve.json"), load("data/outlook.json"), load("data/cities.json"), load("data/wages/catalog.json")])
  .then(async ([d, b, c, w, ins, pr, ol, ci, wc]) => {
    data = d; basket = b; cpi = cpiBase = c; wages = w; insights = ins; preserve = pr; outlook = ol; cityIndex = ci; wageCatalog = wc;
    if (basket) myBasket = loadBasket();
    if (data) applyCity();
    // A city page's preset wins, then ?city=osaka in the link (older links), then the last city used here
    let want = window.PRESET_CITY || new URL(location.href).searchParams.get("city");
    if (!want) { try { want = localStorage.getItem("city"); } catch {} }
    if (data && want && want !== DEFAULT_CITY.id && cityIndex?.cities?.some(c => c.id === want)) await selectCity(want, { remember: false });
    else render();
    if (/[#&]check\b/.test(location.hash)) toggleChecker(true);  // bookmarkable: .../#check
  });
</script>
</body>
</html>
