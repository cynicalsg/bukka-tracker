name: Update price data

on:
  schedule:
    # The Retail Price Survey is published around the 20th–25th of each month.
    # Run on the 26th at 03:17 UTC (12:17 JST).
    - cron: "17 3 26 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch prices from e-Stat
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python fetch/fetch_prices.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update price data ($(date -u +%Y-%m-%d))"
            git push
          fi
